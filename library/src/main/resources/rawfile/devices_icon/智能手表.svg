<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Watch Band -->
  <rect x="45" y="10" width="30" height="100" rx="8" fill="url(#bandGrad)"/>
  
  <!-- Watch Body -->
  <rect x="30" y="30" width="60" height="60" rx="16" fill="url(#watchGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="35" y="35" width="50" height="50" rx="10" fill="url(#screenGrad)"/>
  
  <!-- Screen Content (Subtle) -->
  <circle cx="60" cy="60" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="45" y="58" width="30" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="60" cy="45" r="2" fill="#FFFFFF" fill-opacity="0.6"/>
  
  <!-- Crown Button -->
  <rect x="88" y="50" width="4" height="12" rx="1.5" fill="#64748B"/>
</svg>

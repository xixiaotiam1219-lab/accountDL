<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bodyGradSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="boxShadowStrong" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Body (Space Grey Metallic Finish) -->
  <rect x="35" y="25" width="50" height="65" rx="16" fill="url(#bodyGradSpace)" filter="url(#boxShadowStrong)"/>
  
  <!-- Lid Line (Lighter for contrast on dark body) -->
  <rect x="35" y="46" width="50" height="1.5" fill="#64748B" fill-opacity="0.5"/>
  
  <!-- Front Design Detail -->
  <circle cx="60" cy="65" r="3" fill="#FFFFFF" fill-opacity="0.1"/>
  
  <!-- Power LED (Bright Green) -->
  <circle cx="60" cy="58" r="1.5" fill="#22C55E" filter="url(#boxShadowStrong)"/>
  
  <!-- Glossy Reflection (Top Edge) -->
  <path d="M42,32 Q60,28 78,32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.15"/>
  
  <!-- Charging Port (Bottom) -->
  <rect x="52" y="88" width="16" height="3" rx="1.5" fill="#0F172A"/>
</svg>
